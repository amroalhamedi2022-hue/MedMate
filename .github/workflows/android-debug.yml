# Optional free-tier CI; manual dispatch only, even if the GitHub repository is public.
# No API tokens, signing keys or user PDFs are required.
name: MedMate Android debug validation
on:
  workflow_dispatch:
  push:
    branches: [automation/medmate-v091-source-tree-20261023]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already has an Android SDK; setup-android@v3 attempts
      # to install the removed legacy 'tools' package and fails before Gradle.
      - name: Install Android platform using runner SDK
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate SQLite schema and migration contracts
        run: |
          python3 scripts/test-database-contract.py
          python3 scripts/test-migrations.py
      - name: Run unit tests, lint, and assemble debug APK
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MedMate-validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MedMate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
