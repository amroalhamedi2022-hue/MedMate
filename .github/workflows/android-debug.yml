# Free-tier validation for draft PR updates and manual reruns.
# No API tokens, signing keys or user PDFs are required.
name: MedMate Android debug validation
on:
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read

# Only the newest branch build is useful; avoid consuming CI minutes for
# intermediate source edits in the same functional milestone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already has an Android SDK; setup-android@v3 attempts
      # to install the removed legacy 'tools' package and fails before Gradle.
      - name: Install Android platform using runner SDK
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Validate GGUF device-test and local/cloud safety contracts
        run: |
          bash -n scripts/run-native-gguf-device-test.sh
          bash scripts/test-native-gguf-device-script.sh
          python3 scripts/test-native-gguf-pdf-acceptance-contract.py
          python3 scripts/test-llama-android-provenance.py
          python3 scripts/test-pdf-page-limit-contract.py
          python3 scripts/test-brain-cache-early-return-contract.py
          python3 scripts/test-model-load-ui-contract.py
          python3 scripts/test-model-storage-contract.py
          python3 scripts/test_bouncycastle_runtime_gate.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Assert resolved Bouncy Castle runtime alignment
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/medmate-runtime-dependencies.txt"
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > "$report"
          python3 scripts/bouncycastle_runtime_gate.py "$report"
      - name: Validate SQLite schema and migration contracts
        run: |
          python3 scripts/test-database-contract.py
          python3 scripts/test-migrations.py
      - name: Test APK verifier against metadata drift
        run: python3 scripts/test-verify-apk.py
      - name: Run unit tests, lint, and assemble debug APK
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug
      - name: Verify built APK identity, SDK and offline permissions
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          test -x "$AAPT"
          python3 scripts/verify-apk.py "$APK" "$AAPT"
      - name: Record inner APK SHA-256 for future targeted builds
        if: success()
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -1)"
          test -n "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/APK_SHA256.txt
      - name: Package exact APK pair for physical-device GGUF acceptance
        if: success()
        shell: bash
        run: |
          bundle="app/build/outputs/device-test-bundle"
          mkdir -p "$bundle"
          cp app/build/outputs/apk/debug/app-debug.apk "$bundle/app-debug.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$bundle/app-debug-androidTest.apk"
          (cd "$bundle" && sha256sum app-debug.apk app-debug-androidTest.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MedMate-validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MedMate-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/APK_SHA256.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MedMate-device-test-bundle
          path: app/build/outputs/device-test-bundle/*
          if-no-files-found: error
          retention-days: 14
